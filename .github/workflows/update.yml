name: Update IPTV

on:
  schedule:
    - cron: "0 */6 * * *"        # UTC,每 6 小時一次
  workflow_dispatch:              # 支援手動觸發
  push:
    branches: [main]
    paths:
      - "config/**"
      - "iptv/**"
      - "requirements.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: iptv-update
  cancel-in-progress: false

env:
  PUBLISH_BRANCH: release         # 輸出發佈到的分支(每次強制覆蓋,不累積歷史)
  TZ: Asia/Taipei

jobs:
  update:
    runs-on: ubuntu-latest        # 可改為 self-hosted 以使用你所在地區的網路測速
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect / check / build
        run: python -m iptv.main -c config/config.yaml

      - name: Publish to ${{ env.PUBLISH_BRANCH }} branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd output
          git init -q -b "$PUBLISH_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "update: $(date '+%Y-%m-%d %H:%M:%S')"
          git push -f -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${PUBLISH_BRANCH}"

      - uses: actions/upload-artifact@v4
        with:
          name: iptv-output
          path: output
          retention-days: 3
